<?xml version="1.0" encoding="utf-8" ?>
<j:jelly trim="false" xmlns:j="jelly:core" xmlns:g="glide" xmlns:j2="null" xmlns:g2="null">
<html>
<head>
    <title>Valutazione Risk Assessment</title>
    <style>
        body {
            font-family: SourceSansPro, "Helvetica Neue", Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
        }
        .ra-eval-container {
            max-width: 960px;
            margin: 20px auto;
            padding: 0 15px;
        }
        .ra-eval-header {
            background-color: #293e40;
            color: #ffffff;
            padding: 16px 24px;
            border-radius: 4px 4px 0 0;
            margin-bottom: 0;
        }
        .ra-eval-header h1 {
            margin: 0;
            font-size: 20px;
            font-weight: 400;
        }
        .ra-eval-header h1 strong {
            font-weight: 600;
        }
        .ra-eval-body {
            background-color: #ffffff;
            border: 1px solid #ddd;
            border-top: none;
            border-radius: 0 0 4px 4px;
            padding: 24px;
        }
        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: #293e40;
            border-bottom: 2px solid #e0e0e0;
            padding-bottom: 8px;
            margin-top: 24px;
            margin-bottom: 16px;
        }
        .info-box {
            background-color: #f0f7fb;
            border: 1px solid #bce0f5;
            border-radius: 4px;
            padding: 12px 16px;
            margin-bottom: 16px;
        }
        .info-box .info-label {
            font-weight: 600;
            color: #555;
            display: inline-block;
            min-width: 160px;
        }
        .info-box .info-value { color: #333; }
        .info-row { margin-bottom: 6px; }
        .form-group { margin-bottom: 14px; }
        .form-group label {
            display: block;
            font-weight: 600;
            color: #555;
            margin-bottom: 4px;
            font-size: 13px;
        }
        .form-group label .required-marker {
            color: #d32f2f;
            margin-left: 2px;
        }
        .form-group select,
        .form-group input[type="text"],
        .form-group input[type="date"],
        .form-group textarea {
            width: 100%;
            max-width: 400px;
            padding: 6px 10px;
            border: 1px solid #ccc;
            border-radius: 3px;
            font-size: 13px;
            box-sizing: border-box;
        }
        .form-group textarea {
            max-width: 100%;
            height: 80px;
            resize: vertical;
        }
        .form-group input[readonly] {
            background-color: #f5f5f5;
            color: #666;
        }
        .form-inline-row {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .form-inline-row .form-group {
            flex: 1;
            min-width: 180px;
        }
        .controls-table-wrapper {
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 3px;
        }
        .controls-table {
            width: 100%;
            border-collapse: collapse;
            margin: 0;
        }
        .controls-table thead th {
            background-color: #f5f5f5;
            border-bottom: 2px solid #ddd;
            padding: 10px 12px;
            text-align: left;
            font-size: 13px;
            font-weight: 600;
            color: #555;
            position: sticky;
            top: 0;
            z-index: 1;
        }
        .controls-table tbody td {
            padding: 8px 12px;
            border-bottom: 1px solid #eee;
            font-size: 13px;
            vertical-align: middle;
        }
        .controls-table tbody tr:hover { background-color: #fafafa; }
        .controls-table select {
            width: 100%;
            padding: 4px 8px;
            border: 1px solid #ccc;
            border-radius: 3px;
            font-size: 13px;
        }
        .no-controls-msg {
            padding: 16px;
            text-align: center;
            color: #888;
            font-style: italic;
        }
        .footer-actions {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid #e0e0e0;
            text-align: right;
        }
        .footer-actions .btn {
            display: inline-block;
            padding: 8px 24px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            margin-left: 8px;
        }
        .btn-primary { background-color: #1f8476; color: #fff; }
        .btn-primary:hover { background-color: #17695e; }
        .btn-primary:disabled { background-color: #a0c4bf; cursor: not-allowed; }
        .btn-secondary { background-color: #e0e0e0; color: #333; }
        .btn-secondary:hover { background-color: #ccc; }
        .alert {
            padding: 12px 16px;
            border-radius: 4px;
            margin-bottom: 16px;
            font-size: 13px;
        }
        .alert-danger {
            background-color: #fdecea;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
        .alert-info {
            background-color: #e8f4fd;
            border: 1px solid #bee5eb;
            color: #0c5460;
        }
        .field-error {
            border-color: #d32f2f !important;
            box-shadow: 0 0 0 1px #d32f2f;
        }
        .highlight-flash {
            transition: background-color 0.3s ease;
            background-color: #fff9c4 !important;
        }
        .saving-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(255,255,255,0.7);
            z-index: 9999;
            text-align: center;
            padding-top: 200px;
        }
        .saving-overlay .spinner-text { font-size: 16px; color: #333; }
        .saving-overlay .spinner {
            display: inline-block;
            width: 30px; height: 30px;
            border: 3px solid #ddd;
            border-top-color: #1f8476;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-msg {
            text-align: center;
            padding: 40px;
            color: #666;
            font-size: 14px;
        }
        .loading-msg .spinner {
            display: inline-block;
            width: 24px; height: 24px;
            border: 3px solid #ddd;
            border-top-color: #1f8476;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

<div id="savingOverlay" class="saving-overlay">
    <div>
        <div class="spinner"></div>
        <div class="spinner-text">Salvataggio in corso...</div>
    </div>
</div>

<div class="ra-eval-container">
    <div class="ra-eval-header">
        <h1>Valutazione Risk Assessment &#8212; <strong id="headerNumber"></strong></h1>
    </div>
    <div class="ra-eval-body">
        <div id="errorContainer"></div>
        <div id="mainContent">
            <div class="loading-msg">
                <div class="spinner"></div>
                <div>Caricamento dati in corso...</div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
</j:jelly>
